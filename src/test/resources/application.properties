spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# tests drive builders manually; disable scheduled ticks
pipeline.batch-interval=3600000
pipeline.metrics-dir=./target/test-metrics
pipeline.query-timeout=5s
pipeline.default-page-size=100
pipeline.max-page-size=1000
