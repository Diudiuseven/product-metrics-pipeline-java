server.port=8080
spring.application.name=product-metrics-pipeline

# ---- H2 file-based embedded store (event log + snapshots) ----
spring.datasource.url=jdbc:h2:file:./data/pipeline;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.h2.console.enabled=false

# ---- pipeline tuning (see docs/configuration.md) ----
pipeline.batch-interval=200ms
pipeline.max-batch-events=5000
pipeline.max-events-per-user=10000
pipeline.max-dim-combinations=50000
pipeline.max-affected-users=2000
pipeline.recompute-max-events=2000000
pipeline.thread-pool-size=4
pipeline.query-timeout=5s
pipeline.default-page-size=100
pipeline.max-page-size=1000
pipeline.metrics-dir=./metrics
pipeline.bucket-granularity=DAY
pipeline.verification-interval=30s
pipeline.verification-max-diffs=50
