server.port=0

# ---- Product metrics pipeline configuration ------------------------------
# All bounds are explicit; see docs/SEMANTICS.md and docs/OPERATIONS.md.
pipeline.data-dir=${java.io.tmpdir}/product-metrics-pipeline
pipeline.drain-batch-size=500
pipeline.worker-threads=4
pipeline.max-events-per-metric=5000000
pipeline.max-dimension-groups=10000
pipeline.max-out-of-order-horizon-millis=604800000
pipeline.query-timeout-millis=2000
pipeline.query-page-size=1000
pipeline.drain-interval-millis=20
